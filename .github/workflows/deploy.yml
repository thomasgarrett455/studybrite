name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Don't let two deploys of the same branch run at once; cancel an in-flight one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Deploy backend (EC2)
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/studybrite
            git fetch origin main
            git reset --hard origin/main
            cd server
            npm ci
            npx prisma migrate deploy
            sudo systemctl restart studybrite
            sleep 3
            curl -fsS http://localhost:3000/api/health

  frontend:
    name: Deploy frontend (S3 + CloudFront)
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: studybrite-frontend-925581109930
      CF_DIST_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync dist/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront
        if: env.CF_DIST_ID != ''
        run: aws cloudfront create-invalidation --distribution-id "$CF_DIST_ID" --paths "/*"